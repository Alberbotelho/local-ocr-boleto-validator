<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Empresa - Validação de Comprovantes</title>
  
  <!-- FAVICON GENÉRICO EMBUTIDO (SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><path d='M30 52 L45 67 L72 35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  
  <!-- Fontes e Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bibliotecas de Processamento Local -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #10b981;
      --primary-hover: #059669;
      --card-header-bg: #f8fafc;
    }

    [data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #10b981;
      --primary-hover: #059669;
      --card-header-bg: #131c2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    /* LOGO GENÉRICA "SUA EMPRESA" */
    .brand-generic {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background-color: var(--primary);
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-tagline {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .panel-header {
      background: var(--card-header-bg);
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 16px;
    }

    .panel-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      background: var(--bg-input);
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.05);
    }

    .drop-zone-icon {
      font-size: 32px;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .drop-zone-text {
      font-size: 14px;
      color: var(--text-main);
      font-weight: 500;
    }

    .drop-zone-subtext {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #fileInput {
      display: none;
    }

    .file-selected-name {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      word-break: break-all;
    }

    .extracted-result-box {
      margin-top: 15px;
      padding: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: none;
    }

    .extracted-result-box.visible {
      display: block;
    }

    .extracted-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .extracted-value {
      font-size: 14px;
      font-family: monospace;
      font-weight: bold;
      color: var(--text-main);
      word-break: break-all;
      line-height: 1.4;
      padding: 6px;
      border-radius: 4px;
    }

    .extracted-value.match {
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
    }

    .extracted-value.warning {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid #f59e0b;
    }

    .extracted-value.mismatch {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px dashed #ef4444;
    }

    .actions-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-clear {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-clear:hover {
      background-color: rgba(239, 68, 68, 0.05);
      color: #ef4444;
      border-color: #ef4444;
    }

    .status-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .status-box.info {
      display: block;
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border: 1px solid #3b82f6;
    }

    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
      border: 1px solid #10b981;
    }

    .status-box.warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
      border: 1px solid #f59e0b;
    }

    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    #previewCanvas {
      max-width: 100%;
      margin-top: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: none;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="container">
    <div class="header-bar">
      <!-- LOGO GENÉRICA -->
      <div class="brand-generic">
        <div class="brand-icon">
          <i class="fa-solid fa-file-shield"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">Sua Empresa</span>
          <span class="brand-tagline">Validação de Comprovantes</span>
        </div>
      </div>

      <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="Alternar Tema">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
      </button>
    </div>

    <div class="panel">
      <div class="panel-header">
        Conferência de Código de Barras / Transação
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label for="codigoSistema">Código de Barras / Número Esperado no Sistema</label>
          <input type="text" id="codigoSistema" class="form-control" placeholder="Digite o código para comparar...">
        </div>

        <div class="form-group">
          <label>Arquivo do Comprovante (.jpg, .png ou .pdf)</label>
          
          <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()" tabindex="0">
            <div class="drop-zone-icon"><i class="fa-solid fa-paste"></i></div>
            <div class="drop-zone-text">Cole a imagem aqui (Ctrl+V) ou clique para selecionar</div>
            <div class="drop-zone-subtext">Suporta arquivos JPG, PNG ou PDF</div>
            <div class="file-selected-name" id="fileNameDisplay"></div>
          </div>
          
          <input type="file" id="fileInput" accept=".jpg, .jpeg, .png, .pdf">

          <div class="extracted-result-box" id="extractedResultBox">
            <div class="extracted-label">Código isolado do comprovante (com autocorreção OCR):</div>
            <div class="extracted-value" id="extractedValueText">-</div>
          </div>
        </div>

        <div class="actions-group">
          <button id="btnProcessar" class="btn-submit" onclick="processarArquivo()">
            <i class="fa-solid fa-magnifying-glass"></i> Ler & Comparar Comprovante
          </button>
          <button id="btnLimpar" class="btn-clear" onclick="limparTudo()">
            <i class="fa-solid fa-rotate-right"></i> Limpar
          </button>
        </div>

        <div id="status" class="status-box"></div>
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let arquivoSelecionado = null;

    function toggleTheme() {
      const body = document.body;
      const themeIcon = document.getElementById('themeIcon');
      
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        themeIcon.className = 'fa-solid fa-moon';
      } else {
        body.setAttribute('data-theme', 'dark');
        themeIcon.className = 'fa-solid fa-sun';
      }
    }

    function definirArquivo(file) {
      if (!file) return;
      arquivoSelecionado = file;
      document.getElementById('fileNameDisplay').innerText = `✓ Arquivo carregado: ${file.name || 'Imagem da Área de Transferência (Colada)'}`;
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        definirArquivo(e.target.files[0]);
      }
    });

    document.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          definirArquivo(file);
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        definirArquivo(e.dataTransfer.files[0]);
      }
    });

    // Função de Autocorreção OCR: Substitui letras confusas por números comuns em códigos de boleto
    function corrigirTextoOCR(texto) {
      return texto
        .replace(/[Oo]/g, '0')
        .replace(/[Il|]/g, '1')
        .replace(/[S]/g, '5')
        .replace(/[Z]/g, '2');
    }

    // Isola o melhor trecho de 44 dígitos comparando com o início e o fim esperados pelo sistema
    function extrairTrechoInteligente(textoLido, esperado) {
      const textoCorrigido = corrigirTextoOCR(textoLido);
      const apenasNums = textoCorrigido.replace(/\D/g, '');
      
      const prefixo = esperado.substring(0, 4);
      const sufixo = esperado.substring(esperado.length - 4);

      let melhorCandidato = apenasNums.substring(0, 44);
      let maiorPontuacao = -1;

      for (let i = 0; i <= apenasNums.length - 35; i++) {
        for (let tamanho = 40; tamanho <= 48; tamanho++) {
          if (i + tamanho > apenasNums.length) break;
          const bloco = apenasNums.substring(i, i + tamanho);
          
          let pontuacao = 0;
          if (bloco.startsWith(prefixo)) pontuacao += 10;
          if (bloco.endsWith(sufixo)) pontuacao += 10;
          
          let acertos = 0;
          for (let j = 0; j < Math.min(bloco.length, esperado.length); j++) {
            if (bloco[j] === esperado[j]) acertos++;
          }
          pontuacao += (acertos / esperado.length) * 5;

          if (pontuacao > maiorPontuacao) {
            maiorPontuacao = pontuacao;
            melhorCandidato = bloco;
          }
        }
      }

      return melhorCandidato;
    }

    function calcularSimilaridade(str1, str2) {
      let correspondencias = 0;
      const tamanho = Math.max(str1.length, str2.length);
      for (let i = 0; i < Math.min(str1.length, str2.length); i++) {
        if (str1[i] === str2[i]) correspondencias++;
      }
      return correspondencias / tamanho;
    }

    async function processarArquivo() {
      const codigoInputBruto = document.getElementById('codigoSistema').value.trim();
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('btnProcessar');
      const extractedBox = document.getElementById('extractedResultBox');
      const extractedVal = document.getElementById('extractedValueText');

      if (!codigoInputBruto) {
        alert('Por favor, informe o número do código de barras para validação.');
        return;
      }

      if (!arquivoSelecionado) {
        alert('Por favor, selecione ou cole um comprovante.');
        return;
      }

      const apenasNumerosSistema = codigoInputBruto.replace(/\D/g, '');

      if (!apenasNumerosSistema) {
        alert('O número inserido para busca não contém dígitos válidos.');
        return;
      }

      btn.disabled = true;
      statusDiv.className = 'status-box info';
      statusDiv.innerText = 'Lendo o comprovante, aplicando autocorreção e cruzando dados...';
      extractedBox.classList.remove('visible');

      try {
        let imageSource = null;

        if (arquivoSelecionado.type === 'application/pdf') {
          statusDiv.innerText = 'Renderizando primeira página do PDF...';
          imageSource = await converterPdfParaImagem(arquivoSelecionado);
        } else {
          imageSource = arquivoSelecionado;
        }

        statusDiv.innerText = 'Executando OCR local (Tesseract.js)... Aguarde.';
        
        const worker = await Tesseract.createWorker('por');
        const ret = await worker.recognize(imageSource);
        await worker.terminate();

        const textoExtraido = ret.data.text;
        
        const codigoIsolado = extrairTrechoInteligente(textoExtraido, apenasNumerosSistema);
        
        extractedVal.innerText = codigoIsolado || '(Nenhum código identificado)';
        extractedBox.classList.add('visible');

        const sim = calcularSimilaridade(codigoIsolado, apenasNumerosSistema);
        const exato = (codigoIsolado === apenasNumerosSistema);

        // NÍVEL 1: SUCESSO EXATO
        if (exato || sim >= 0.98) {
          extractedVal.className = 'extracted-value match';
          statusDiv.className = 'status-box success';
          statusDiv.innerText = `✓ SUCESSO: O código do boleto confere exatamente com o sistema! (Compatibilidade: ${(sim * 100).toFixed(1)}%)`;
        } 
        // NÍVEL 2: ALERTA INTERMEDIÁRIO
        else if (sim >= 0.83 && sim < 0.98) {
          extractedVal.className = 'extracted-value warning';
          statusDiv.className = 'status-box warning';
          statusDiv.innerText = `⚠ ATENÇÃO (ALERTA): Alta semelhança (${(sim * 100).toFixed(1)}%), mas os dígitos centrais diferem. Pode ser um boleto de outro mês/valor do mesmo cliente! Verifique manualmente.`;
        } 
        // NÍVEL 3: FALHA TOTAL
        else {
          extractedVal.className = 'extracted-value mismatch';
          statusDiv.className = 'status-box error';
          statusDiv.innerText = `✕ FALHA: Divergência total! O comprovante não corresponde ao sistema. (Compatibilidade: ${(sim * 100).toFixed(1)}%)`;
        }

      } catch (err) {
        console.error(err);
        statusDiv.className = 'status-box error';
        statusDiv.innerText = 'Erro durante a leitura do arquivo: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function limparTudo() {
      document.getElementById('codigoSistema').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('fileNameDisplay').innerText = '';
      document.getElementById('extractedResultBox').classList.remove('visible');
      document.getElementById('extractedValueText').innerText = '-';
      document.getElementById('status').className = 'status-box';
      document.getElementById('status').innerText = '';
      
      const canvas = document.getElementById('previewCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = 'none';

      arquivoSelecionado = null;
    }

    async function converterPdfParaImagem(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);

      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.getElementById('previewCanvas');
      const context = canvas.getContext('2d');

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport: viewport }).promise;

      return canvas.toDataURL('image/png');
    }
  </script>
</body>
</html>
